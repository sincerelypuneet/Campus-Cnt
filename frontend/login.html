<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>Sign in | CampusSpace</title>
  <link rel="stylesheet" href="login.css" />
  <script src="login.js" defer></script>
</head>
<body>
  <main class="login-screen">
    <section class="login-card" aria-labelledby="login-title">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">C</span> CampusSpace</a>
      <p class="eyebrow">YOUR CAMPUS, MADE SIMPLE</p>
      <h1 id="login-title">Welcome to your campus space</h1>
      <p class="description">Sign in with your campus account to manage teachers, rooms, schedules, and resources.</p>

      <form id="login-form" class="login-form">
        <label for="login-email">Campus email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required />
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        <button class="sign-in-button" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>

      <a class="demo-link" href="admin.html">Preview admin dashboard <span aria-hidden="true">→</span></a>
      <p class="demo-note">Preview only; protected data and actions still require sign-in.</p>
      <p class="form-message" id="login-message" role="alert" aria-live="assertive" hidden></p>
      <a class="back-link" href="index.html">← Back to CampusSpace</a>
    </section>
  </main>
</body>
</html>
