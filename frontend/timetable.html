<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusSpace – Teacher Timetable</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="timetable.css" />
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js" defer></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="wrapper">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header"><h2>CampusSpace</h2></div>
      <ul class="nav-list">
        <li><a href="admin.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a href="teachers.html" class="nav-link"><i class="fas fa-chalkboard-teacher"></i> Teacher Management</a></li>
        <li><a href="timetable.html" class="nav-link active"><i class="fas fa-calendar-alt"></i> Timetable Management</a></li>
        <!-- other links omitted for brevity -->
        <li><a href="#" class="nav-link" id="logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </nav>

    <main class="content">
      <header class="topbar">
        <button class="toggle-btn" id="toggle-sidebar"><i class="fas fa-bars"></i></button>
        <div class="profile"><span id="user-email">teacher@campusspace.local</span><img src="logo.svg" alt="Profile" class="avatar" /></div>
      </header>

      <section class="dashboard" style="padding:1.5rem;">
        <h1 class="section-title">My Timetable</h1>
        <div class="toolbar">
          <button id="add-entry" class="action-btn"><i class="fas fa-plus"></i> Add Entry</button>
          <select id="view-mode">
            <option value="weekly">Weekly View</option>
            <option value="daily">Daily View</option>
          </select>
        </div>
        <div id="timetable-container" class="timetable-grid">
          <!-- Grid will be generated by JS -->
        </div>
      </section>
    </main>
  </div>

  <!-- Modal for add / edit entry -->
  <div class="modal" id="entry-modal">
    <div class="modal-content">
      <span class="close" id="modal-close">&times;</span>
      <h2 id="modal-title">Add Timetable Entry</h2>
      <form id="entry-form">
        <label>Subject Name<input type="text" name="subjectName" required /></label>
        <label>Subject Code<input type="text" name="subjectCode" required /></label>
        <label>Department<select name="departmentId" id="dept-select" required></select></label>
        <label>Class / Semester<input type="text" name="classOrSemester" required /></label>
        <label>Section<input type="text" name="section" required /></label>
        <label>Day<select name="day" required>
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Friday">Friday</option>
          <option value="Saturday">Saturday</option>
        </select></label>
        <label>Start Time<input type="time" name="startTime" required /></label>
        <label>End Time<input type="time" name="endTime" required /></label>
        <label>Building<input type="text" name="building" required /></label>
        <label>Floor<input type="text" name="floor" /></label>
        <label>Classroom Number<input type="text" name="classroomNumber" required /></label>
        <label>Classroom (select existing)<select name="classroomId" id="classroom-select" required></select></label>
        <button type="submit" class="action-btn">Save</button>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
  <script src="timetable.js"></script>
</body>
</html>
